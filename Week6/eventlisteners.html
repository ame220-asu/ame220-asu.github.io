<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating/Changing Content Dyamically Using Javascript</title>
    <script type="module">
/* The event its listening for 
What the event is supposed to do 
What’s the target of the event
The target of the event, is an HTML element*/ 


// I need Javascript to store the REFERENCE to an HTML element 
// document means THE ENTIRE DOCUMENT  (but usually references the ELEMENTS in the BODY of the HTML page)
// getElementById (SEARCH FOR THE ELEMENT WITH THIS ID AND RETURN ITS REFERENCE )
        const button = document.getElementById('eventButton') // HOLDING THIS DATA TO MANIPULATE 

        // with the reference to the HTML element, I need you to ADD a listener for Javascript so that when it is FIRED, it will perform an action 
        button.addEventListener('click', function(){
           let div = document.getElementById('target')
           div.innerHTML = "<h1>I fired!</h1>"
           div.style.backgroundColor= "red"
        })
    </script>
</head>
<body>

    <button id="eventButton">Click me!</button>

    <div id="target"></div>
    
</body>
</html>
